<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xlsx-to-js device memory check</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #1f2328; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #d0d7de; padding: 6px; text-align: left; vertical-align: top; }
    tr[data-status="ok"] td:nth-child(2) { color: #1a7f37; }
    tr[data-status="error"] td:nth-child(2), tr[data-status="crashed"] td:nth-child(2) { color: #cf222e; }
    pre { white-space: pre-wrap; word-break: break-all; background: #f6f8fa; padding: 8px; font-size: 12px; }
    button { margin: 4px 8px 4px 0; padding: 8px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountMemoryCheck } from '/src/memory/memoryCheck.ts';
    mountMemoryCheck(document.getElementById('app'));
  </script>
</body>
</html>
